<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" width="680" height="330" role="img" aria-label="立体图：一根导线斜穿画面，电流 I 沿导线流向右下方；导线周围是一圈圈垂直于导线的环形磁力线，环上箭头朝左下，逆着电流看是逆时针">
  <!--
    立体图。照着课件右下那张 3D 小图画：
      导线是一根有体积的实体，斜着从左上穿到右下，右下这头朝着观察者。
      磁力线是**垂直于导线**的圆，投影成椭圆 —— 短轴顺着导线、长轴垂直于导线。
      ⚠️ 把椭圆画在纸面里、长轴顺着导线，等于说「磁力线和导线共面」，那是错的。
      环上箭头朝左下 —— 电流朝观察者流来，逆着电流看过去是逆时针，满足右手螺旋法则。
    遮挡关系（关键，否则环看着像贴在导线后面而不是绕着它）：
      每个环拆成远、近两个半椭圆。远半（页面上半）先画 → 导线 → 近半（页面下半）。
      视角略微俯视，所以环的远侧在页面上偏上、近侧偏下。
      远半画淡、画细，近半画实、画粗，前后才分得开。
    ⚠️ 半环是用采样折线生成的，不要改回 A 命令 —— 当弧的两个端点正好是短轴两端
      （间距 = 2rx）时，Chrome 会把其中一个半弧吃掉，只画出半个 U 形。
    ⚠️ 环上箭头放在环的左上斜边 t≈140°，不是环顶。t=90° 是「离导线最远」的点、切线还斜；
      t≈106° 是屏幕最高点，那里切线水平、箭头底边竖着，整支像插在环上的小旗子，很丑。
      斜边上切线是斜的，箭头顺着斜边走才像长在环上。切向量必须把透视缩放 s(t) 一起求导。
    ⚠️ 下标用 <tspan dy="4">，上标用 dy="-8"，别写反。
    颜色写死在这里（<img> 引不到页面 CSS 变量），深浅靠 prefers-color-scheme 切。
  -->
  <style>
    .rod-a { stop-color: #5aa8cc; }
    .rod-b { stop-color: #8ed3ee; }
    .rod-c { stop-color: #2e8ab4; }
    .rod-d { stop-color: #12668f; }
    .rod-e { stop-color: #0a4a6b; }
    .cap   { fill: #9fd4ea; }
    .cur   { fill: none; stroke: #ba0c2f; stroke-width: 2; stroke-linecap: round; }
    .cur-h { fill: #ba0c2f; }
    .flux-f{ fill: none; stroke: #46596a; stroke-width: 1.45; opacity: 0.82; stroke-linecap: round; }
    .flux-n{ fill: none; stroke: #2b3b48; stroke-width: 1.85; stroke-linecap: round; }
    .halo  { fill: none; stroke: #ffffff; stroke-width: 5; opacity: 0.34; }
    .flux-h{ fill: #46596a; stroke: #46596a; stroke-width: 0.9; stroke-linejoin: round; }
    .lead  { fill: none; stroke: #98a8b5; stroke-width: 1; }
    .lbl   { fill: #46586a; font-size: 11.5px;
             font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .var   { fill: #46586a; font-size: 14px; font-style: italic;
             font-family: Georgia, "Times New Roman", serif; }
    .red   { fill: #ba0c2f; }

    @media (prefers-color-scheme: dark) {
      .rod-a { stop-color: #3f9dc6; }
      .rod-b { stop-color: #a8e8ff; }
      .rod-c { stop-color: #2aa5d8; }
      .rod-d { stop-color: #1478a3; }
      .rod-e { stop-color: #0b5a7d; }
      .cap   { fill: #b8e4f7; }
      .cur   { stroke: #ff7a8a; }
      .cur-h { fill: #ff7a8a; }
      .flux-f{ stroke: #c3d2dd; opacity: 0.78; }
      .flux-n{ stroke: #e2edf4; }
      .halo  { stroke: #0b0f13; opacity: 0.5; }
      .flux-h{ fill: #c3d2dd; stroke: #c3d2dd; stroke-width: 0.9; stroke-linejoin: round; }
      .lead  { stroke: #5b6c78; }
      .lbl   { fill: #a3b5c2; }
      .var   { fill: #a3b5c2; }
      .red   { fill: #ff7a8a; }
    }
  </style>

  <defs>
    <!-- 沿导线截面的明暗渐变：0.28 处是圆柱的高光带，两端收暗 -->
    <linearGradient id="rodg" x1="0" y1="0" x2="0" y2="1">
      <stop class="rod-a" offset="0" />
      <stop class="rod-b" offset="0.22" />
      <stop class="rod-c" offset="0.5" />
      <stop class="rod-d" offset="0.78" />
      <stop class="rod-e" offset="1" />
    </linearGradient>
  </defs>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372" role="img" aria-label="耦合线的四种阻抗：奇模、静态、单根线、偶模随间距的比较，以及微带截面（线宽 6mil、间距 6mil、介质厚 3.6mil、εr 4.4）">
  <!-- 基准=视频原片幻灯片（ffmpeg -ss 900 抽帧 + PIL 逐像素量网格线与蓝点）。 -->
  <style>
  .ax   { stroke:#8f98a3; stroke-width:1.1; fill:none; }
  .gl   { stroke:#c3c9d0; stroke-width:0.8; fill:none; }
  .ln   { fill:none; stroke:#2b2bb4; stroke-width:2; stroke-dasharray:5 4; stroke-linecap:round; }
  .dot  { fill:#2b2bb4; }
  .tx   { fill:#2f3b45; font-family:Georgia,"Times New Roman",serif; font-size:11.5px; }
  .cat  { fill:#2f3b45; font-family:Georgia,"Times New Roman",serif; font-size:12.5px; }
  .it   { font-style:italic; }
  .sub  { font-size:9.5px; }
  .sd   { font-family:Arial,Helvetica,sans-serif; font-style:normal; }
  .dimL { fill:#3d4a26; font-family:Georgia,"Times New Roman",serif; font-size:10.5px; }
  .dim  { fill:#5b6a78; font-family:Georgia,"Times New Roman",serif; font-size:10.5px; }
  .dims { stroke:#5b6a78; stroke-width:0.9; fill:none; }
  .slab { fill:#e4eecd; stroke:#b3c489; stroke-width:1; }
  .cond { fill:#d8611f; stroke:#8f3d1c; stroke-width:1; stroke-linejoin:round; }
  .gnd  { fill:#e0872f; stroke:#8f3d1c; stroke-width:1; }
  @media (prefers-color-scheme: dark) {
    .ax  { stroke:#5d6975; }
    .gl  { stroke:#4a5563; }
    .ln  { stroke:#8f8ff0; }
    .dot { fill:#8f8ff0; }
    .tx, .cat { fill:#c9d3dc; }
    .dim { fill:#9aa8b6; } .dims { stroke:#9aa8b6; }
    .slab { fill:#e4eecd; stroke:#b3c489; }
    .cond { fill:#d8611f; stroke:#8f3d1c; }
    .gnd  { fill:#e0872f; stroke:#8f3d1c; }
  }
  </style>

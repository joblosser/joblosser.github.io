  <!--
    照着 ADS 里的仿真截图画的。纵轴 -2..10 mA，横轴 0..8 nsec。
    ⚠️ 返回电流是**正**的、和信号电流几乎重合 —— 不要画到负半轴去。
       两者差 1.5%，看着像一条线，正是原图的样子。
    坐标：x=88 是 t=0，x=560 是 t=8；y=272 是 -2 mA，y=52 是 10 mA。
  -->
  <style>
    .grid  { stroke: #e4e9ed; stroke-width: 1; }
    .axis  { fill: none; stroke: #c9d2d9; stroke-width: 1.2; }
    .sig   { fill: none; stroke: #00629b; stroke-width: 2;
             stroke-linejoin: round; stroke-linecap: round; }
    .ret   { fill: none; stroke: #ba0c2f; stroke-width: 1.4;
             stroke-linejoin: round; stroke-linecap: round; }
    .mk    { fill: none; stroke: #ba0c2f; stroke-width: 1.1; }
    .tick  { fill: #5a6c7d; font-size: 11px;
             font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .lbl   { fill: #46586a; font-size: 11.5px;
             font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .mid   { text-anchor: middle; }
    .end   { text-anchor: end; }

    @media (prefers-color-scheme: dark) {
      .grid  { stroke: #22303c; }
      .axis  { stroke: #3d4d5a; }
      .sig   { stroke: #00b5e2; }
      .ret   { stroke: #ff7a8a; }
      .mk    { stroke: #ff7a8a; }
      .tick  { fill: #7d8f9d; }
      .lbl   { fill: #a3b5c2; }
    }
  </style>


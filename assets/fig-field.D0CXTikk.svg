<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" role="img" aria-label="传输线横截面：电场线从信号线指向参考平面，磁场线环绕信号线">
  <!--
    横截面的电磁场分布，照着课件里那张仿真图画的：
      - 电场：从信号线出发、落到参考平面上的曲线（两端切线都竖直）
      - 磁场：以信号线为圆心的同心圆
    ⚠️ 电场是「线」不是「几根竖直虚线」，磁场是「同心圆」不是 ⊗/⊙ ——
       ⊗/⊙ 是**侧视**（沿线的方向看）的画法，横截面上 B 应该是环绕的圆。
    颜色写死在这里（<img> 引不到页面 CSS 变量），深浅靠 prefers-color-scheme 切。
  -->
  <style>
    .diel  { fill: #e9eff4; }
    .plane { fill: #9aa8b4; }
    .trace { fill: #00629b; }
    .e     { fill: none; stroke: #00879f; stroke-width: 1.2; stroke-linecap: round; }
    .e-hd  { fill: #00879f; }
    .b     { fill: none; stroke: #00629b; stroke-width: 1; stroke-dasharray: 2 3; opacity: 0.55; }
    .lbl   { fill: #46586a; font-size: 11.5px;
             font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .sw    { stroke: #b6c2cc; stroke-width: 0.8; }

    @media (prefers-color-scheme: dark) {
      .diel  { fill: #121b23; }
      .plane { fill: #4a5f70; }
      .trace { fill: #00b5e2; }
      .e     { stroke: #7fe3f0; }
      .e-hd  { fill: #7fe3f0; }
      .b     { stroke: #00b5e2; opacity: 0.45; }
      .lbl   { fill: #a3b5c2; }
      .sw    { stroke: #35454f; }
    }
  </style>

  <!-- 介质 -->
  <rect class="diel" x="60" y="118" width="370" height="132" />
  <!-- 参考平面 -->
  <rect class="plane" x="48" y="250" width="394" height="16" rx="2" />
  <!-- 信号线 -->
  <rect class="trace" x="216" y="100" width="58" height="18" rx="2" />

  <!-- 磁场：以信号线为圆心的同心圆 -->
  <g class="b">
    <circle cx="245" cy="109" r="16" />
    <circle cx="245" cy="109" r="30" />
    <circle cx="245" cy="109" r="46" />
    <circle cx="245" cy="109" r="62" />
    <circle cx="245" cy="109" r="80" />
  </g>

  <!-- 电场：从信号线落到参考平面，两端切线竖直 -->
  <g class="e">
    <path d="M218 118 C218 177 105 191 105 250" />
    <path d="M227 118 C227 177 150 191 150 250" />
    <path d="M236 118 C236 177 195 191 195 250" />
    <path d="M245 118 C245 177 245 191 245 250" />
    <path d="M254 118 C254 177 295 191 295 250" />
    <path d="M263 118 C263 177 340 191 340 250" />
    <path d="M272 118 C272 177 385 191 385 250" />
  </g>
  <g class="e-hd">
    <path d="M101 248 L105 256 L109 248 Z" />
    <path d="M146 248 L150 256 L154 248 Z" />
    <path d="M191 248 L195 256 L199 248 Z" />
    <path d="M241 248 L245 256 L249 248 Z" />
    <path d="M291 248 L295 256 L299 248 Z" />
    <path d="M336 248 L340 256 L344 248 Z" />
    <path d="M381 248 L385 256 L389 248 Z" />
  </g>

  <!-- 图例 -->
  <rect class="sw trace" x="500" y="72" width="14" height="9" rx="1" />
  <text class="lbl" x="522" y="81">信号路径</text>

  <rect class="sw diel" x="500" y="104" width="14" height="9" rx="1" />
  <text class="lbl" x="522" y="113">介质 εr</text>

  <rect class="sw plane" x="500" y="136" width="14" height="9" rx="1" />
  <text class="lbl" x="522" y="145">参考平面（返回路径）</text>

  <path class="e" d="M500 172 H514" />
  <text class="lbl" x="522" y="176">电场 E，指向参考平面</text>

  <circle class="b" cx="507" cy="204" r="7" />
  <text class="lbl" x="522" y="208">磁场 B，环绕信号线</text>
</svg>

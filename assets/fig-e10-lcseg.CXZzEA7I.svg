<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" role="img" aria-label="单根传输线一小段的集总参数模型（对齐视频原片）：上为三维结构（绿色参考平板上依次叠介质层与黄色信号导体，浅蓝半透明薄片标出 dz 段，标 V 与 I），下为等效电路（串联电感 L₀ 与并联电容 C₀，左端口 i(z)、v(z)，右端口 i(z+dz)、v(z+dz)），右侧公式 Δv = L·di/dt 与 Δi = C·dv/dt">

  .strip { fill:#f2d13c; } .stripS { fill:#cfa81e; }
  .slab { fill:#d9e8f1; fill-opacity:0.62; }
  .slabO { fill:none; stroke:#2f3b45; stroke-width:1.2; }
  .loop { fill:none; stroke:#a9b7c0; stroke-width:8; stroke-linecap:round; }
  .loopF { fill:#a9b7c0; }
  @media (prefers-color-scheme: dark) {
    .inkS { stroke:#c9d3dc; } .inkF { fill:#c9d3dc; }

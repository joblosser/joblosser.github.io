  <path class="hl" d="M110.0 191.0 L101.0 195.5 L101.0 186.5 Z" /><text class="dimtx" x="496" y="195">0.5 oz</text><path class="cC" d="M484.0 191.0 L471.0 191.0" />
  <path class="hl" d="M462.0 191.0 L471.0 186.5 L471.0 195.5 Z" /><text class="dimtx" x="496" y="212">4.8 mils</text><path class="cC" d="M484.0 208.0 L471.0 208.0" />
  <path class="hl" d="M462.0 208.0 L471.0 203.5 L471.0 212.5 Z" /><text class="sm" x="70" y="224" text-anchor="end">BOTTOM</text><path class="cC" d="M78.0 220.0 L101.0 220.0" />
  <path class="hl" d="M110.0 220.0 L101.0 224.5 L101.0 215.5 Z" /><text class="dimtx" x="496" y="224">0.5 mils / 0.5 oz</text><path class="cC" d="M484.0 220.0 L471.0 220.0" />
  <path class="hl" d="M462.0 220.0 L471.0 215.5 L471.0 224.5 Z" /><text class="sm hl" x="444" y="195" text-anchor="end">参考平面</text><text class="sm" x="118" y="258">上平面存在：Z<tspan dy="4" font-size="9">0</tspan><tspan dy="-4"></tspan> = 49.48 Ω　　撤掉上平面：Z<tspan dy="4" font-size="9">0</tspan><tspan dy="-4"></tspan> = 50.23 Ω</text>

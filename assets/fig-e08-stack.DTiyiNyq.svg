  <path class="hl" d="M110.0 54.0 L101.0 58.5 L101.0 49.5 Z" /><text class="dimtx" x="496" y="58">0.5 oz</text><path class="cC" d="M484.0 54.0 L471.0 54.0" />
  <path class="hl" d="M462.0 54.0 L471.0 49.5 L471.0 58.5 Z" /><text class="dimtx" x="496" y="72">6.3 mil</text><path class="cC" d="M484.0 68.0 L471.0 68.0" />

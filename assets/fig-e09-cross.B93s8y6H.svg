<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-label="表层微带线与内层带状线的典型横截面：走线均 6 mil 宽；表层一侧介质 3.6 mil、只有下方一个参考平面；内层上下各 8 mil 介质、上下都是参考平面。对应单位长度电感 7.5 / 9 nH/in、单位长度电容 3 / 3.5 pF/in">
  <!-- 坐标由 gen-e09.cjs 算出，不手写。下标 <tspan baseline-shift="sub">。 -->
  <style>
  .ln   { fill:none; stroke:#00629b; stroke-width:2; stroke-linecap:round; }

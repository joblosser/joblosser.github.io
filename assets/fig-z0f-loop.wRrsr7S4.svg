<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" width="680" height="290" role="img" aria-label="信号电流的完整环路：驱动器经走线到接收器，再由地过孔进入参考平面，沿平面回到驱动器，构成闭合回路">
  <!--
    坐标由 gen-z0f.cjs 算出，不手写。
    ⚠️ 下标 <tspan dy="4">、上标 <tspan dy="-8">，正负号别写反。
    颜色写死（<img> 引不到页面 CSS 变量），深浅靠 prefers-color-scheme 切。
  -->
  <style>
  .ln   { fill:none; stroke:#00629b; stroke-width:2; stroke-linecap:round; }
  .ln2  { fill:none; stroke:#00629b; stroke-width:1.3; }
  .fld  { fill:none; stroke:#00629b; stroke-width:1; opacity:.6; }
  .fldh { fill:#00629b; opacity:.7; }
  .cL   { fill:none; stroke:#00629b; stroke-width:2.2; stroke-linecap:round; }
  .cC   { fill:none; stroke:#ba0c2f; stroke-width:2.2; stroke-linecap:round; }
  .cZ   { fill:none; stroke:#00796b; stroke-width:2.2; stroke-linecap:round; }
  .dim  { fill:none; stroke:#8a97a3; stroke-width:1.2; }
  .dimh { fill:#8a97a3; }
  .dimr { fill:none; stroke:#ba0c2f; stroke-width:1.4; }
  .dimhr{ fill:#ba0c2f; }
  .hl   { fill:#ba0c2f; }
  .ax   { fill:none; stroke:#8a97a3; stroke-width:1.2; }
  .cu   { fill:#ccd9e6; stroke:#00629b; stroke-width:1.6; }
  .di   { fill:#eef4f9; stroke:#00629b; stroke-width:1.2; }
  .pl   { fill:#d9e3ec; stroke:#00629b; stroke-width:1.6; }
  .lbl  { fill:#46586a; font-size:12px; font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .sm   { fill:#46586a; font-size:10.5px; font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  .var  { fill:#46586a; font-size:13px; font-style:italic; font-family:Georgia,"Times New Roman",serif; }
  .tick { fill:#46586a; font-size:10.5px; font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  @media (prefers-color-scheme: dark) {
    .ln,.ln2 { stroke:#00b5e2; } .fld { stroke:#00b5e2; }
    .fldh { fill:#00b5e2; }
    .cL { stroke:#00b5e2; } .cC { stroke:#ff7a8a; } .cZ { stroke:#4db6ac; }
    .dim { stroke:#8b9aa7; } .dimh { fill:#8b9aa7; }
    .dimr { stroke:#ff7a8a; } .dimhr { fill:#ff7a8a; }
    .hl { fill:#ff7a8a; }
    .ax { stroke:#8b9aa7; }
    .cu { fill:#31495e; stroke:#00b5e2; } .di { fill:#182631; stroke:#00b5e2; }
    .pl { fill:#22374a; stroke:#00b5e2; }
    .lbl,.sm,.var,.tick { fill:#a3b5c2; }
  }
</style>
<rect class="di" x="40" y="140" width="600" height="90" /><rect class="pl" x="40" y="230" width="600" height="18" /><text class="sm" x="48" y="198">介质</text><rect class="cu" x="60" y="90" width="90" height="50" /><text class="lbl" x="105" y="120" text-anchor="middle">驱动器</text><rect class="cu" x="530" y="90" width="90" height="50" /><text class="lbl" x="575" y="120" text-anchor="middle">接收器</text><rect class="cu" x="150" y="132" width="380" height="8" /><path class="cC" d="M165.0 136.0 L506.0 136.0" />
  <path class="hl" d="M515.0 136.0 L506.0 140.5 L506.0 131.5 Z" /><rect class="cu" x="96" y="140" width="8" height="90" /><rect class="cu" x="576" y="140" width="8" height="90" /><path class="cC" d="M580 152 V239 H100 V152" /><path class="cC" d="M580.0 152.0 L580.0 193.0" />
  <path class="hl" d="M580.0 202.0 L575.5 193.0 L584.5 193.0 Z" /><path class="cC" d="M400.0 239.0 L389.0 239.0" />
  <path class="hl" d="M380.0 239.0 L389.0 234.5 L389.0 243.5 Z" /><path class="cC" d="M100.0 217.0 L100.0 161.0" />
  <path class="hl" d="M100.0 152.0 L104.5 161.0 L95.5 161.0 Z" /><text class="sm" x="340" y="122" text-anchor="middle">去程：信号走线</text><text class="sm" x="340" y="268" text-anchor="middle">回程：参考平面</text><text class="sm" x="592" y="194">地过孔</text>
</svg>

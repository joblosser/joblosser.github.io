<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 262" width="400" height="262" role="img" aria-label="直角三角形：直角边 a_n 与 −b_n，斜边是根号下 a_n 平方加 b_n 平方，夹角 φ_n">

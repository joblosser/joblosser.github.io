<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" width="680" height="250" role="img" aria-label="三种电容：平板电容、走线与过孔之间的电容、走线与下方平面之间的电容">
  <!--
    照着课件那三张立体示意图重画，统一成斜投影（dx=22, dy=12）。
    三个场景说明同一件事：只要有被介质包围的两个导体，就有电容。
    形状只影响电容大小，不决定有没有 —— 所以画三种差别很大的结构。

    ⚠️ 走线（trace）和平面（metal）都是铜，但这里必须用两个明度区分开，
       否则贴在一起就成一块了。
  -->
  <style>
    .metal  { fill: #00629b; }
    .metal-d{ fill: #004a75; }
    .trace  { fill: #5cb8d8; }
    .diel   { fill: #dde6ee; }
    .diel-d { fill: #c3d1de; }
    .ef     { fill: none; stroke: #00879f; stroke-width: 1.2; stroke-linecap: round; }
    /* 画在深色金属面上的电场线，用浅色才看得见 */
    .ef-l   { fill: none; stroke: #d5f0fa; stroke-width: 1.3; stroke-linecap: round; }
    .dim    { fill: none; stroke: #8a97a3; stroke-width: 1; }
    .lbl    { fill: #46586a; font-size: 12px;
              font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .onm    { fill: #eaf2f8; font-size: 12px;
              font-family: Georgia, "Times New Roman", serif; font-style: italic; }
    .var    { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 13px; }
    .ttl    { fill: #46586a; font-size: 12px;
              font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }

    @media (prefers-color-scheme: dark) {
      .metal  { fill: #0076a0; }
      .metal-d{ fill: #005c80; }
      .trace  { fill: #4fd0f0; }
      .diel   { fill: #1d262c; }
      .diel-d { fill: #26323a; }
      .ef     { stroke: #7fe3f0; }
      .ef-l   { stroke: #d8f6ff; }
      .dim    { stroke: #8b9aa7; }
      .lbl, .ttl { fill: #b4c4d0; }
      .onm    { fill: #eaf8ff; }
    }
  </style>

  <!-- ==================== 左：平板电容 ==================== -->
  <path class="metal"   d="M55 90 L165 90 L187 78 L77 78 Z" />
  <path class="metal-d" d="M55 90 L165 90 L165 97 L55 97 Z" />
  <path class="metal-d" d="M165 90 L187 78 L187 85 L165 97 Z" />

  <path class="diel"    d="M55 97 L165 97 L165 131 L55 131 Z" />
  <path class="diel-d"  d="M165 97 L187 85 L187 119 L165 131 Z" />

  <path class="metal"   d="M55 131 L165 131 L187 119 L77 119 Z" />
  <path class="metal-d" d="M55 131 L165 131 L165 138 L55 138 Z" />
  <path class="metal-d" d="M165 131 L187 119 L187 126 L165 138 Z" />

  <text class="onm" x="106" y="88">S</text>
  <text class="lbl" x="64" y="119"><tspan class="var">ε</tspan><tspan dy="3" font-size="10">r</tspan></text>

  <path class="dim" d="M198 97 V131" />
  <path class="dim" d="M193 97 H203 M193 131 H203" />
  <text class="lbl var" x="208" y="118">d</text>

  <text class="ttl" x="112" y="160" text-anchor="middle">平板电容</text>

  <!-- ==================== 中：走线与过孔 ==================== -->
  <path class="metal"   d="M250 118 L400 118 L422 106 L272 106 Z" />
  <path class="metal-d" d="M250 118 L400 118 L400 125 L250 125 Z" />
  <path class="metal-d" d="M400 118 L422 106 L422 113 L400 125 Z" />

  <!-- 走线（贴在平面上） -->
  <path class="trace" d="M262 109 L330 109 L330 118 L262 118 Z" />

  <!-- 过孔 -->
  <circle class="trace" cx="378" cy="113" r="11" />
  <circle class="diel" cx="378" cy="113" r="5" />

  <!-- 两者之间的电场线 -->
  <path class="ef-l" d="M334 106 Q 348 113 362 106" />
  <path class="ef-l" d="M336 113 H 360" />
  <path class="ef-l" d="M334 120 Q 348 113 362 120" />

  <text class="lbl var" x="349" y="97">C</text>

  <text class="ttl" x="336" y="150" text-anchor="middle">走线与过孔</text>

  <!-- ==================== 右：走线与平面 ==================== -->
  <path class="metal"   d="M480 132 L630 132 L652 120 L502 120 Z" />
  <path class="metal-d" d="M480 132 L630 132 L630 139 L480 139 Z" />
  <path class="metal-d" d="M630 132 L652 120 L652 127 L630 139 Z" />

  <path class="trace"   d="M510 92 L600 92 L622 80 L532 80 Z" />
  <path class="metal-d" d="M510 92 L600 92 L600 99 L510 99 Z" />
  <path class="metal-d" d="M600 92 L622 80 L622 87 L600 99 Z" />

  <path class="ef" d="M520 101 V125" />
  <path class="ef" d="M555 101 V125" />
  <path class="ef" d="M590 101 V125" />
  <path class="ef" d="M516 121 L520 128 L524 121" />
  <path class="ef" d="M551 121 L555 128 L559 121" />
  <path class="ef" d="M586 121 L590 128 L594 121" />

  <text class="lbl var" x="642" y="110">C</text>

  <text class="ttl" x="566" y="160" text-anchor="middle">走线与下方平面</text>
</svg>

  <path class="dimh" d="M334 105 L328 108 L334 111 Z M402 105 L408 108 L402 111 Z" /><text class="var" x="368" y="100" text-anchor="middle">w</text><text class="sm" x="368" y="87" text-anchor="middle">线宽</text><path class="dim" d="M408 128 H434 M408 160 H434" /><path class="dim" d="M434 128 V160" />

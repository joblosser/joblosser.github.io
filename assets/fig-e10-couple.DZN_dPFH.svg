<svg xmlns="http://www.w3.org/2000/svg" viewBox="22 64 686 360" width="720" height="378" role="img" aria-label="两根线之间的耦合：上为双线三维结构（又长又扁的橄榄黄板面，远边一条亮绿带，板面两条橙红导体条，编号 1 在远侧、2 在近侧），左下为电容耦合等效（导体 1、2 之间互容 C_m，各自经 C₀ 接到 0 plane），右下为互感示意（两只 L₀ 线圈之间存在互感 L_m），底部为两组电压与电流方程">
  <!-- 基准=视频原片幻灯片（ffmpeg 抽帧 + PIL 逐像素量比例）；坐标由 gen-e10-couple.cjs 算出。 -->
  <style>
  .inkS { fill:none; stroke:#2f3b45; stroke-width:1.7; stroke-linecap:round; }
  .inkF { fill:#2f3b45; }
  .coil { fill:none; stroke:#2f3b45; stroke-width:2.6; stroke-linecap:round; }
  .num  { fill:#201e06; font-size:16.5px; font-family:Georgia,"Times New Roman",serif; }
  .var  { fill:#2f3b45; font-size:14px; font-style:italic; font-family:Georgia,"Times New Roman",serif; }
  .el   { fill:#2f3b45; font-size:12.5px; font-family:Georgia,"Times New Roman",serif; }
  .fx   { fill:#2f3b45; font-style:italic; font-family:Georgia,"Times New Roman",serif; }
  .top  { fill:url(#gTopL); }
  .band { fill:#73ea6a; } .bandD { fill:#75bb3c; }
  .side { fill:#8a8c31; } .rim { fill:#a85400; }
  /* 导体条 = 橙红填充 + 深棕描边（原片就是描边的，这一圈边是"条浮在板面上"的关键） */
  .stT  { fill:#d06036; stroke:#8f3d1c; stroke-width:1; stroke-linejoin:round; }
  /* 每个面都描一条深橄榄细边：板是浅色实物，两套主题都用深边，立体关系才立得住 */
  .edge { fill:none; stroke:#6f6a18; stroke-width:0.85; stroke-linejoin:round; }
  /* 下标里的数字：正体 + 窄体（数学排版里数字是正体，变量才斜体；用 Georgia 斜体会和小写 o 分不清） */
  .sd { font-family:Arial,Helvetica,sans-serif; font-style:normal; }
  .vioF { fill:#dcdcff; stroke:#4b4bd8; stroke-width:2; }
  @media (prefers-color-scheme: dark) {
    .inkS, .coil { stroke:#c9d3dc; } .inkF { fill:#c9d3dc; }
    .var, .el, .fx { fill:#c9d3dc; }
    .top { fill:url(#gTopD); }
    .band { fill:#6edc66; } .bandD { fill:#70b038; }
    .side { fill:#858730; } .rim { fill:#c05c0c; }
    .stT { fill:#c95b33; stroke:#8a3a1a; }
    .edge { stroke:#6a6515; }
    .vioF { fill:#2a2a52; stroke:#8f8ff0; }
  }
</style>

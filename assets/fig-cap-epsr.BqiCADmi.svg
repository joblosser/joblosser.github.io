<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" width="680" height="300" role="img" aria-label="相对介电常数的定义：同样的一对导体，周围是空气时记作 C0，换成其他介质时记作 C，两者之比就是 εr">
  <!--
    照着课件「相对介电常数」那一页画的：
      同一对导体、同样的空间尺寸，只换周围介质 —— 空气 → C0，其他介质 → C，
      两者的比值就是相对介电常数 εr。
    用平行板表示「这两个导体」（正文说「不管这两个导体是什么形状」，取最简单的形式）。
    ⚠️ 记号跟正文保持一致：正文用的是 $C_0$ 和 $C$（课件那一页写的是 C_air / C_sub，
       两套记号不能混，图和正文必须同套）。
    颜色写死在这里（<img> 引不到页面 CSS 变量），深浅靠 prefers-color-scheme 切。
  -->
  <style>
    .metal { fill: #00629b; }
    .diel  { fill: #eef3f7; }
    .dim   { fill: none; stroke: #8a97a3; stroke-width: 1.2; }
    .dim-h { fill: #8a97a3; }
    .ttl   { fill: #46586a; font-size: 13px;
             font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .inlbl { fill: #6a7b8a; font-size: 11px;
             font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    .f     { fill: #46586a; font-size: 20px; font-style: italic;
             font-family: Georgia, "Times New Roman", serif; }
    .f-sub { fill: #46586a; font-size: 13px; font-style: italic;
             font-family: Georgia, "Times New Roman", serif; }
    .fbar  { fill: none; stroke: #46586a; stroke-width: 1.4; }

    @media (prefers-color-scheme: dark) {
      .metal { fill: #00b5e2; }
      .diel  { fill: #1d262c; }
      .dim   { stroke: #8b9aa7; }
      .dim-h { fill: #8b9aa7; }
      .ttl   { fill: #b4c4d0; }
      .inlbl { fill: #8b9aa7; }
      .f, .f-sub { fill: #c9d6e0; }
      .fbar  { stroke: #c9d6e0; }
    }
  </style>

  <!-- ==================== 左：周围是空气 ==================== -->
  <text class="ttl" x="185" y="78" text-anchor="middle">周围是空气</text>
  <rect class="metal" x="95" y="104" width="180" height="11" rx="1.5" />
  <rect class="metal" x="95" y="163" width="180" height="11" rx="1.5" />
  <text class="inlbl" x="185" y="146" text-anchor="middle">空气</text>
  <text class="f" x="185" y="208" text-anchor="middle">C</text>
  <text class="f-sub" x="196" y="212" text-anchor="middle">0</text>

  <!-- ==================== 右：周围是其他介质 ==================== -->
  <text class="ttl" x="495" y="78" text-anchor="middle">周围是其他介质</text>
  <rect class="diel"  x="405" y="115" width="180" height="48" />
  <rect class="metal" x="405" y="104" width="180" height="11" rx="1.5" />
  <rect class="metal" x="405" y="163" width="180" height="11" rx="1.5" />
  <text class="inlbl" x="495" y="146" text-anchor="middle">介质</text>
  <text class="f" x="495" y="208" text-anchor="middle">C</text>

  <!-- 同样的结构，只换介质 -->
  <path class="dim" d="M300 140 H380" />
  <path class="dim-h" d="M306 134 L296 140 L306 146 Z M374 134 L384 140 L374 146 Z" />
  <text class="ttl" x="340" y="124" text-anchor="middle">同样的结构，只换介质</text>

  <!-- ==================== 比值 ==================== -->
  <text class="f" x="286" y="256">ε</text>
  <text class="f-sub" x="301" y="260">r</text>
  <text class="f" x="320" y="256">=</text>

  <!-- 分子 -->
  <text class="f" x="372" y="240" text-anchor="middle">C</text>
  <path class="fbar" d="M356 250 H388" />
  <!-- 分母 -->
  <text class="f" x="367" y="278" text-anchor="middle">C</text>
  <text class="f-sub" x="378" y="282" text-anchor="middle">0</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 276" width="680" height="276" role="img" aria-label="同一小段末端开路时输入呈容性、短路时呈感性；两者输入阻抗相乘等于特性阻抗的平方">
  <!-- 坐标由 gen-e09.cjs 算出，不手写。下标 <tspan baseline-shift="sub">。 -->
  <style>
  .ln   { fill:none; stroke:#00629b; stroke-width:2; stroke-linecap:round; }

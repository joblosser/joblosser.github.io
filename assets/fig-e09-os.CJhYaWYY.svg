="sub" font-size="9">in_open</tspan> · Z<tspan baseline-shift="sub" font-size="9">in_short</tspan> = L / C = Z<tspan baseline-shift="sub" font-size="9">0</tspan><tspan baseline-shift="super" font-size="9">2</tspan></text><text class="sm" x="340" y="256" text-anchor="middle">开路、短路输入阻抗相乘，恰为特性阻抗的平方</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-label="表层与内层走线的阻抗随线间距变化：奇模、静态、偶模三条曲线都随间距增大向单根线阻抗收敛，内层收敛得快得多。两图右上角为截面示意图：表层是微带，标出线宽 6mil、间距 gap、介质厚 h 与 εr = 4.4，地板在介质下方；内层是带状线，导体夹在上下两层地板之间，上下各一层厚 h 的介质，总厚 2h">
  <!-- 基准=视频原片幻灯片（ffmpeg -ss 1070 抽帧 + PIL 逐像素量网格线与三条曲线的点）。 -->
  <style>
  .ax  { stroke:#8f98a3; stroke-width:1.1; fill:none; }
  .gl  { stroke:#c9cfd6; stroke-width:0.8; fill:none; }
  .tx  { fill:#2f3b45; font-family:Georgia,"Times New Roman",serif; font-size:10.5px; }
  .ttl { fill:#2f3b45; font-family:Georgia,"Times New Roman",serif; font-size:12.5px; }
  .it  { font-style:italic; }
  .sub { font-size:8.5px; }
  .lnE { fill:none; stroke:#2b2bb4;  stroke-width:1.6; stroke-dasharray:5 3.5; }
  .lnQ { fill:none; stroke:#3f9b34; stroke-width:1.6; stroke-dasharray:5 3.5; }
  .lnO { fill:none; stroke:#c0392b;   stroke-width:1.6; stroke-dasharray:5 3.5; }
  .dE  { fill:#2b2bb4; }  .dQ { fill:#3f9b34; }  .dO { fill:#c0392b; }
  .slab { fill:#e4eecd; stroke:#b3c489; stroke-width:0.8; }
  .cond { fill:#d8611f; stroke:#8f3d1c; stroke-width:0.8; }
  .gnd  { fill:#e0872f;  stroke:#8f3d1c; stroke-width:0.8; }
  .dim  { stroke:#2f6fa8; stroke-width:0.8; fill:none; }
  .dimt { fill:#2f6fa8; font-family:Georgia,"Times New Roman",serif; font-size:10.5px; }
  /* 曲线旁的直接标注（原片就是标在曲线边上，不靠图例）。
     基线色必须写在 @media 之前，深色主题那条才能盖住它 */
  .lb { fill:#2f3b45; font-family:Georgia,"Times New Roman",serif; font-style:italic; font-size:11.5px; }
  @media (prefers-color-scheme: dark) {
    .ax { stroke:#5d6975; }
    .gl { stroke:#39434d; }
    .tx, .ttl { fill:#c9d3dc; }
    .lnE { stroke:#8f8ff0; } .dE { fill:#8f8ff0; }
    .lnQ { stroke:#6fd06a; } .dQ { fill:#6fd06a; }
    .lnO { stroke:#f0705f; }  .dO { fill:#f0705f; }
    .slab { fill:#e4eecd; stroke:#b3c489; }
    .cond { fill:#d8611f; stroke:#8f3d1c; }
    .gnd  { fill:#e0872f; stroke:#8f3d1c; }
    .dim  { stroke:#7fb6e6; }
    .dimt { fill:#7fb6e6; }
    .lb   { fill:#c9d3dc; }
  }
  /* 落在浅绿介质上的标注：必须写在 @media 之后，两套主题都用深色；
     否则深色主题下 .dimt 的浅蓝会覆盖它，浅蓝压浅绿等于看不见 */
  .dimF  { stroke:#2f6fa8; }
  .dimtF { fill:#2a5f8c; }
  </style>

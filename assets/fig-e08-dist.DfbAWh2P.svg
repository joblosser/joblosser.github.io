<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="680" height="270" role="img" aria-label="返回电流分布：h 是介质厚度、d 是离开走线中心线的水平距离，两者从平面表面上同一点量起；走线正下方电流密度最高，离正下方越远越小，按 1/(1+(d/h)²) 衰减">
  <!--
    坐标由 gen-e08.cjs 算出，不手写。
    ⚠️ 下标 <tspan dy="4">、上标 <tspan dy="-8">，正负号别写反。
    颜色写死（<img> 引不到页面 CSS 变量），深浅靠 prefers-color-scheme 切。
  -->
  <style>
  .ln   { fill:none; stroke:#00629b; stroke-width:2; stroke-linecap:round; }
  .ln2  { fill:none; stroke:#00629b; stroke-width:1.3; }
